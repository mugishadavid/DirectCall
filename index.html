<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DirectCall</title>
    <link rel="stylesheet" href="css/style.v2.css">
</head>
<body>
    <div id="auth-screen" class="screen active">
        <div class="glass-card">
            <h1 class="app-title">DirectCall</h1>
            <p class="subtitle">Offline P2P Calling</p>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <label class="remember-me">
                    <input type="checkbox" id="auth-remember"> Remember username and password
                </label>
                <button type="submit" id="auth-btn">Login</button>
            </form>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="header">
            <div class="user-badge">
                <span class="dot online"></span>
                <span id="my-username">User</span>
            </div>
            <button id="btn-logout" class="icon-btn">Logout</button>
        </div>

        <div class="dial-container">
            <input type="text" id="target-input" placeholder="Enter ID Number..." autocomplete="off">
            <button id="btn-call-main" class="call-btn-massive">CALL</button>
        </div>

        <div class="nearby-container">
            <h3>Nearby ID Numbers</h3>
            <div id="nearby-list">
                <p class="empty-state">Scanning...</p>
            </div>
        </div>
    </div>

    <div id="call-screen" class="screen">
        <div class="call-ui">
            <div class="avatar-large">??</div>
            <h2 id="call-target-name">Unknown</h2>
            <p id="call-status">Negotiating connection...</p>
            <h1 id="call-timer">00:00</h1>
            <button id="btn-end-call" class="end-call-btn">END CALL</button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
